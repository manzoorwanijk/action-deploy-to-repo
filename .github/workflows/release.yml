name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write

# One release at a time, so two of them cannot race the moving major tag.
concurrency: release

jobs:
  release:
    name: Publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Move the major tag
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # pipefail, so a failure in the pipeline below is not hidden by tail.
          set -euo pipefail
          major="${TAG%%.*}"
          # Tags pushed after the checkout are not in the clone yet.
          git fetch --tags --force --quiet
          newest="$(git tag --list "$major.*" |
            grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)"
          [ -n "$newest" ] || { echo "no release tag matched $major.*"; exit 1; }
          # An out of order release must not drag the major tag backwards.
          if [ "$newest" != "$TAG" ]; then
            echo "$newest is newer than $TAG, leaving $major where it is"
            exit 0
          fi
          git tag -f "$major" "$TAG"
          git push --force origin "refs/tags/$major"

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes
